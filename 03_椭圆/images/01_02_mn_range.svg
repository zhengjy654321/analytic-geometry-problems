<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 170" width="600" height="170" font-family="sans-serif" font-size="12">
<rect width="600" height="170" fill="#fff"/>
<text x="20" y="22" font-weight="bold" fill="#1e3a5f">x²/(m−1) + y²/(3−m) = 1 ：m 在不同范围时表示什么</text>
<rect x="40" y="52" width="130" height="26" fill="#fee2e2"/>
<rect x="170" y="52" width="130" height="26" fill="#dbeafe"/>
<rect x="300" y="52" width="130" height="26" fill="#dbeafe"/>
<rect x="430" y="52" width="130" height="26" fill="#fee2e2"/>
<line x1="30" y1="100" x2="575" y2="100" stroke="#334155" stroke-width="1.6"/>
<path d="M575,100 l-8,-4 v8 z" fill="#334155"/>
<text x="580" y="104" font-style="italic" font-family="serif">m</text>
<line x1="170" y1="94" x2="170" y2="106" stroke="#334155" stroke-width="1.6"/><text x="166" y="122" fill="#334155">1</text>
<circle cx="170" cy="100" r="4.5" fill="#fff" stroke="#334155" stroke-width="1.5"/>
<line x1="300" y1="94" x2="300" y2="106" stroke="#334155" stroke-width="1.6"/><text x="296" y="122" fill="#334155">2</text>
<circle cx="300" cy="100" r="4.5" fill="#d97706"/>
<line x1="430" y1="94" x2="430" y2="106" stroke="#334155" stroke-width="1.6"/><text x="426" y="122" fill="#334155">3</text>
<circle cx="430" cy="100" r="4.5" fill="#fff" stroke="#334155" stroke-width="1.5"/>
<text x="105" y="70" text-anchor="middle" font-weight="bold" fill="#b91c1c">双曲线</text>
<text x="235" y="70" text-anchor="middle" font-weight="bold" fill="#1d4ed8">椭圆</text>
<text x="365" y="70" text-anchor="middle" font-weight="bold" fill="#1d4ed8">椭圆</text>
<text x="495" y="70" text-anchor="middle" font-weight="bold" fill="#b91c1c">双曲线</text>
<text x="105" y="44" text-anchor="middle" fill="#475569">焦点在 y 轴</text>
<text x="235" y="44" text-anchor="middle" fill="#475569">焦点在 y 轴</text>
<text x="365" y="44" text-anchor="middle" fill="#475569">焦点在 x 轴</text>
<text x="495" y="44" text-anchor="middle" fill="#475569">焦点在 x 轴</text>
<text x="300" y="142" text-anchor="middle" fill="#b45309">m = 2：圆（两分母相等）</text>
<text x="170" y="160" text-anchor="middle" fill="#64748b">m = 1：分母为 0，无意义</text>
<text x="430" y="160" text-anchor="middle" fill="#64748b">m = 3：分母为 0，无意义</text>
</svg>
