<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 315" width="540" height="315">
  <rect width="540" height="315" fill="#ffffff"/>
  <!-- Baseline AD -->
  <line x1="48" y1="175" x2="475" y2="175" stroke="#334155" stroke-width="1.5"/>

  <!-- Circle O: center (314,175), r=112 -->
  <circle cx="314" cy="175" r="112" fill="#f0fdfa" fill-opacity="0.4" stroke="#1e3a5f" stroke-width="2.2"/>

  <!-- Triangle PAB and bisectors PC, PD and radius PO -->
  <line x1="266.7" y1="73.5" x2="90" y2="175" stroke="#1e3a5f" stroke-width="1.9"/>
  <line x1="266.7" y1="73.5" x2="258" y2="175" stroke="#1e3a5f" stroke-width="1.9"/>
  <line x1="266.7" y1="73.5" x2="202" y2="175" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="6,3"/>
  <line x1="266.7" y1="73.5" x2="426" y2="175" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="6,3"/>
  <line x1="266.7" y1="73.5" x2="314" y2="175" stroke="#d97706" stroke-width="1.8"/>

  <!-- Right-angle marker at P between PC and PD (unit vecs: PC=(-0.537,0.844), PD=(0.844,0.537)) -->
  <polyline points="260.3,83.6 270.4,90.1 276.8,80.0" fill="none" stroke="#0f766e" stroke-width="1.4"/>

  <!-- Points -->
  <circle cx="90" cy="175" r="4" fill="#1e3a5f"/>
  <circle cx="202" cy="175" r="3.8" fill="#0f766e"/>
  <circle cx="258" cy="175" r="4" fill="#1e3a5f"/>
  <circle cx="314" cy="175" r="4" fill="#d97706"/>
  <circle cx="426" cy="175" r="3.8" fill="#0f766e"/>
  <circle cx="266.7" cy="73.5" r="4.2" fill="#dc2626"/>

  <!-- Labels -->
  <text x="82" y="196" font-family="serif" font-style="italic" font-weight="bold" font-size="14" fill="#1e3a5f">A</text>
  <text x="195" y="196" font-family="serif" font-style="italic" font-weight="bold" font-size="14" fill="#0f766e">C</text>
  <text x="252" y="196" font-family="serif" font-style="italic" font-weight="bold" font-size="14" fill="#1e3a5f">B</text>
  <text x="308" y="196" font-family="serif" font-style="italic" font-weight="bold" font-size="14" fill="#b45309">O</text>
  <text x="424" y="196" font-family="serif" font-style="italic" font-weight="bold" font-size="14" fill="#0f766e">D</text>
  <text x="260" y="61" font-family="serif" font-style="italic" font-weight="bold" font-size="14" fill="#dc2626">P</text>
  <text x="296" y="124" font-family="serif" font-style="italic" font-size="13" fill="#b45309">r</text>

  <!-- Key takeaways callout -->
  <rect x="24" y="18" width="182" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="34" y="36" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#1e3a5f">核心几何关系</text>
  <text x="34" y="53" font-family="sans-serif" font-size="10.5" fill="#0f766e">• PC、PD 为内外角平分线，PC⊥PD</text>
  <text x="34" y="69" font-family="sans-serif" font-size="10.5" fill="#b45309">• △PAO ∽ △BPO ⇒ |OA|·|OB|=r²</text>
  <text x="34" y="84" font-family="sans-serif" font-size="10.5" fill="#475569">• C、D 为直径端点，A、B 在圆心同侧</text>
</svg>
