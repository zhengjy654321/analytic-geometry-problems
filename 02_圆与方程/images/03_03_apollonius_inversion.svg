<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" width="540" height="300">
  <rect width="540" height="300" fill="#ffffff"/>
  <!-- Line MOA -->
  <line x1="40" y1="160" x2="465" y2="160" stroke="#334155" stroke-width="1.5"/>

  <!-- Circle O: center (180,160), r=105 -->
  <circle cx="180" cy="160" r="105" fill="#fffbeb" fill-opacity="0.45" stroke="#1e3a5f" stroke-width="2.2"/>

  <!-- Segments PA, PE, PO -->
  <line x1="212.4" y1="60.1" x2="390" y2="160" stroke="#1e3a5f" stroke-width="2"/>
  <line x1="212.4" y1="60.1" x2="232.5" y2="160" stroke="#dc2626" stroke-width="2"/>
  <line x1="212.4" y1="60.1" x2="180" y2="160" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5,4"/>

  <!-- Points -->
  <circle cx="75" cy="160" r="3.8" fill="#475569"/>
  <circle cx="180" cy="160" r="4" fill="#d97706"/>
  <circle cx="232.5" cy="160" r="4.2" fill="#dc2626"/>
  <circle cx="285" cy="160" r="3.8" fill="#475569"/>
  <circle cx="390" cy="160" r="4.2" fill="#1e3a5f"/>
  <circle cx="212.4" cy="60.1" r="4.2" fill="#0f766e"/>

  <!-- Labels -->
  <text x="60" y="180" font-family="serif" font-style="italic" font-size="14" fill="#475569">M</text>
  <text x="174" y="180" font-family="serif" font-style="italic" font-weight="bold" font-size="14" fill="#b45309">O</text>
  <text x="226" y="180" font-family="serif" font-style="italic" font-weight="bold" font-size="14" fill="#dc2626">E</text>
  <text x="220" y="196" font-family="sans-serif" font-size="10" fill="#dc2626">(反演点)</text>
  <text x="289" y="180" font-family="serif" font-style="italic" font-size="14" fill="#475569">N</text>
  <text x="385" y="180" font-family="serif" font-style="italic" font-weight="bold" font-size="14" fill="#1e3a5f">A</text>
  <text x="372" y="196" font-family="sans-serif" font-size="10" fill="#1e3a5f">(已知定点)</text>
  <text x="208" y="48" font-family="serif" font-style="italic" font-weight="bold" font-size="14" fill="#0f766e">P</text>
  <text x="186" y="114" font-family="serif" font-style="italic" font-size="13" fill="#b45309">r</text>

  <!-- Formula box -->
  <rect x="308" y="18" width="218" height="74" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="318" y="36" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#1e3a5f">阿氏圆反演核心</text>
  <text x="318" y="54" font-family="sans-serif" font-size="10.5" fill="#dc2626">• E 在射线 OA 上，|OA|·|OE|=r²</text>
  <text x="318" y="70" font-family="sans-serif" font-size="10.5" fill="#0f766e">• |PA| / |PE| = λ = r / |OE| = |OA| / r</text>
  <text x="318" y="85" font-family="sans-serif" font-size="10.5" fill="#475569">• 从而将加权距离转化为普通线段和</text>
</svg>
