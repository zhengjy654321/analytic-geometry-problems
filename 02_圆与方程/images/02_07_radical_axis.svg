<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 205" width="560" height="205">
  <rect width="560" height="205" fill="#ffffff"/>
  <!-- Panel 1: 相交 -->
  <rect x="6" y="6" width="176" height="193" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="25" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a5f">① 相交：公共弦</text>
  <line x1="25" y1="108" x2="164" y2="108" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <circle cx="68" cy="108" r="42" fill="#eff6ff" fill-opacity="0.45" stroke="#1e3a5f" stroke-width="1.8"/>
  <circle cx="122" cy="108" r="34" fill="#f0fdfa" fill-opacity="0.45" stroke="#0f766e" stroke-width="1.8"/>
  <!-- Radical axis x: (x-68)^2 - (x-122)^2 = 42^2 - 34^2 = 608 -> 108x = 608 + 14884 - 4624 = 10868 -> x=100.6 -->
  <line x1="100.6" y1="44" x2="100.6" y2="172" stroke="#dc2626" stroke-width="2.1"/>
  <circle cx="68" cy="108" r="2.8" fill="#1e3a5f"/>
  <circle cx="122" cy="108" r="2.8" fill="#0f766e"/>
  <text x="58" y="123" font-family="serif" font-style="italic" font-size="11" fill="#1e3a5f">C₁</text>
  <text x="122" y="123" font-family="serif" font-style="italic" font-size="11" fill="#0f766e">C₂</text>
  <text x="105" y="54" font-family="serif" font-style="italic" font-size="12" fill="#dc2626">l</text>
  <text x="28" y="189" font-family="sans-serif" font-size="9.8" fill="#475569">l 过两交点且 l ⊥ C₁C₂</text>

  <!-- Panel 2: 外切 -->
  <rect x="192" y="6" width="176" height="193" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="232" y="25" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a5f">② 相切：公切线</text>
  <line x1="208" y1="108" x2="352" y2="108" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <circle cx="248" cy="108" r="36" fill="#eff6ff" fill-opacity="0.45" stroke="#1e3a5f" stroke-width="1.8"/>
  <circle cx="314" cy="108" r="30" fill="#f0fdfa" fill-opacity="0.45" stroke="#0f766e" stroke-width="1.8"/>
  <line x1="284" y1="44" x2="284" y2="172" stroke="#dc2626" stroke-width="2.1"/>
  <circle cx="284" cy="108" r="3.4" fill="#dc2626"/>
  <text x="238" y="123" font-family="serif" font-style="italic" font-size="11" fill="#1e3a5f">C₁</text>
  <text x="314" y="123" font-family="serif" font-style="italic" font-size="11" fill="#0f766e">C₂</text>
  <text x="289" y="54" font-family="serif" font-style="italic" font-size="12" fill="#dc2626">l</text>
  <text x="210" y="189" font-family="sans-serif" font-size="9.8" fill="#475569">l 过切点 T 且 l ⊥ C₁C₂</text>

  <!-- Panel 3: 外离 -->
  <rect x="378" y="6" width="176" height="193" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="410" y="25" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a5f">③ 外离：等幂根轴</text>
  <line x1="392" y1="115" x2="540" y2="115" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <circle cx="424" cy="115" r="24" fill="#eff6ff" fill-opacity="0.45" stroke="#1e3a5f" stroke-width="1.8"/>
  <circle cx="512" cy="115" r="32" fill="#f0fdfa" fill-opacity="0.45" stroke="#0f766e" stroke-width="1.8"/>
  <!-- Radical axis x: (x-424)^2 - (x-512)^2 = 24^2 - 32^2 = -448 -> x = 468 - 448/(2*88) = 465.4 -->
  <line x1="465.4" y1="42" x2="465.4" y2="170" stroke="#dc2626" stroke-width="2.1"/>
  <!-- Point P(465.4, 54) on radical axis with two equal tangents to C1 and C2 -->
  <circle cx="465.4" cy="54" r="3.6" fill="#d97706"/>
  <line x1="465.4" y1="54" x2="416.8" y2="92.1" stroke="#d97706" stroke-width="1.5"/>
  <line x1="465.4" y1="54" x2="520.6" y2="84.2" stroke="#d97706" stroke-width="1.5"/>
  <text x="469" y="54" font-family="serif" font-style="italic" font-weight="bold" font-size="11.5" fill="#b45309">P</text>
  <text x="414" y="130" font-family="serif" font-style="italic" font-size="11" fill="#1e3a5f">C₁</text>
  <text x="510" y="130" font-family="serif" font-style="italic" font-size="11" fill="#0f766e">C₂</text>
  <text x="394" y="189" font-family="sans-serif" font-size="9.8" fill="#b45309">l 上任一点 |PT₁| = |PT₂|</text>
</svg>
