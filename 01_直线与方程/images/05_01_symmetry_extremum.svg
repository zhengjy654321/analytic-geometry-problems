<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220">
  <rect width="560" height="220" fill="#ffffff"/>
  <!-- Left Panel: 同侧和最小 -->
  <rect x="8" y="8" width="266" height="204" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="20" y="28" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#1e3a5f">同侧求和最小（将军饮马）</text>
  <!-- Line l -->
  <line x1="22" y1="130" x2="260" y2="130" stroke="#334155" stroke-width="1.8"/>
  <text x="252" y="123" font-family="serif" font-style="italic" font-size="12" fill="#334155">l</text>
  <!-- A(65,65), C(215,80), C'(215,180) -> intersection Q with y=130: t=(130-65)/(180-65)=65/115=0.565 -> x=65+150*0.565=149.8 -->
  <line x1="215" y1="80" x2="215" y2="180" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="65" y1="65" x2="215" y2="180" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="149.8" y1="130" x2="215" y2="80" stroke="#0f766e" stroke-width="1.8"/>
  <circle cx="65" cy="65" r="3.8" fill="#1e3a5f"/>
  <circle cx="215" cy="80" r="3.8" fill="#1e3a5f"/>
  <circle cx="215" cy="180" r="3.8" fill="#dc2626"/>
  <circle cx="149.8" cy="130" r="4" fill="#0f766e"/>
  <text x="52" y="60" font-family="serif" font-style="italic" font-weight="bold" font-size="13" fill="#1e3a5f">A</text>
  <text x="222" y="80" font-family="serif" font-style="italic" font-weight="bold" font-size="13" fill="#1e3a5f">C</text>
  <text x="222" y="185" font-family="serif" font-style="italic" font-weight="bold" font-size="13" fill="#dc2626">C'</text>
  <text x="142" y="148" font-family="serif" font-style="italic" font-weight="bold" font-size="13" fill="#0f766e">Q</text>
  <text x="20" y="202" font-family="sans-serif" font-size="10.2" fill="#0f766e">(|QA|+|QC|)min = |AC'|（三点共线）</text>

  <!-- Right Panel: 异侧差最大 -->
  <rect x="286" y="8" width="266" height="204" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="298" y="28" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#1e3a5f">异侧求差最大（对称共线）</text>
  <line x1="300" y1="125" x2="538" y2="125" stroke="#334155" stroke-width="1.8"/>
  <text x="530" y="118" font-family="serif" font-style="italic" font-size="12" fill="#334155">l</text>
  <!-- A(345,55), B(415,165) -> B'(415,85). Line A(345,55) through B'(415,85) extends to y=125: t=(125-55)/(85-55)=70/30=2.333 -> x=345+70*2.333=508.3 -->
  <line x1="415" y1="85" x2="415" y2="165" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="345" y1="55" x2="508.3" y2="125" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="508.3" y1="125" x2="415" y2="165" stroke="#0f766e" stroke-width="1.8"/>
  <circle cx="345" cy="55" r="3.8" fill="#1e3a5f"/>
  <circle cx="415" cy="165" r="3.8" fill="#1e3a5f"/>
  <circle cx="415" cy="85" r="3.8" fill="#dc2626"/>
  <circle cx="508.3" cy="125" r="4" fill="#0f766e"/>
  <text x="332" y="53" font-family="serif" font-style="italic" font-weight="bold" font-size="13" fill="#1e3a5f">A</text>
  <text x="422" y="172" font-family="serif" font-style="italic" font-weight="bold" font-size="13" fill="#1e3a5f">B</text>
  <text x="422" y="83" font-family="serif" font-style="italic" font-weight="bold" font-size="13" fill="#dc2626">B'</text>
  <text x="506" y="143" font-family="serif" font-style="italic" font-weight="bold" font-size="13" fill="#0f766e">P</text>
  <text x="298" y="202" font-family="sans-serif" font-size="10.2" fill="#dc2626">||PA|−|PB||max = |AB'|（连线延长交 l）</text>
</svg>
