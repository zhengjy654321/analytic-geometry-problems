<text x="336.0" y="132.0" font-family="serif" font-style="italic" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="start">A₁(a, 0)</text>
<text x="216.0" y="54.0" font-family="serif" font-style="italic" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="start">B₁(0, b)</text>
<text x="196.0" y="158.0" font-family="serif" font-style="italic" font-size="14" font-weight="bold" fill="#334155" text-anchor="start">O</text>
<rect x="400" y="30" width="192" height="94" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="410" y="50" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a5f" text-anchor="start">性质 4：内切于顶点菱形</text>
<text x="410" y="72" font-family="sans-serif" font-size="12"  fill="#334155" text-anchor="start">A₁B₁：bx + ay − ab = 0</text>
<text x="410" y="94" font-family="sans-serif" font-size="12"  fill="#0f766e" text-anchor="start">d = ab/√(a²+b²) = r</text>
<text x="410" y="116" font-family="sans-serif" font-size="12"  fill="#7c3aed" text-anchor="start">⇒ 菱形四边都与内准圆相切</text>
