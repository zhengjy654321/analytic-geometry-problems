<text x="235.0" y="185.3" font-family="serif" font-style="italic" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="start">θ</text>
<rect x="392" y="22" width="200" height="160" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="402" y="42" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a5f" text-anchor="start">椭圆的内准圆（a=3, b=2）</text>
<text x="402" y="64" font-family="sans-serif" font-size="12"  fill="#334155" text-anchor="start">B(n cosθ, n sinθ)</text>
<text x="402" y="86" font-family="sans-serif" font-size="12"  fill="#334155" text-anchor="start">A(−m sinθ, m cosθ)</text>
<text x="402" y="108" font-family="sans-serif" font-size="12"  fill="#334155" text-anchor="start">1/m² + 1/n² = 1/a² + 1/b²</text>
<text x="402" y="130" font-family="sans-serif" font-size="12"  fill="#334155" text-anchor="start">等面积：|AB|·r = m·n</text>
<text x="402" y="152" font-family="sans-serif" font-size="12"  fill="#0f766e" text-anchor="start">r² = a²b²/(a²+b²)</text>
<text x="402" y="174" font-family="sans-serif" font-size="12"  fill="#d97706" text-anchor="start">AB 始终与内准圆相切于 H</text>
</svg>
