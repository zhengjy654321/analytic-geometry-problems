<text x="143.9" y="103.6" font-family="serif" font-style="italic" font-size="14" font-weight="bold" fill="#1e3a5f" text-anchor="start">A</text>
<text x="301.8" y="135.1" font-family="serif" font-style="italic" font-size="14" font-weight="bold" fill="#1e3a5f" text-anchor="start">B</text>
<text x="208.5" y="109.6" font-family="serif" font-style="italic" font-size="14" font-weight="bold" fill="#d97706" text-anchor="start">H</text>
