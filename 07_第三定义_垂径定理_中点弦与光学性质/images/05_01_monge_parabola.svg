<text x="406" y="50" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a5f" text-anchor="start">y² = 2px 的两条垂直切线</text>
<text x="406" y="72" font-family="sans-serif" font-size="12"  fill="#334155" text-anchor="start">切线 PA：y₁y = p(x + x₁)</text>
<text x="406" y="94" font-family="sans-serif" font-size="12"  fill="#334155" text-anchor="start">切线 PB：y₂y = p(x + x₂)</text>
<text x="406" y="116" font-family="sans-serif" font-size="12"  fill="#dc2626" text-anchor="start">PA ⊥ PB ⇒ y₁y₂ = −p²</text>
<text x="406" y="138" font-family="sans-serif" font-size="12"  fill="#334155" text-anchor="start">联立得 x_P = y₁y₂ / (2p)</text>
<text x="406" y="160" font-family="sans-serif" font-size="12"  fill="#dc2626" text-anchor="start">⇒ x_P = −p/2，P 在准线上</text>
