<text x="402" y="42" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a5f" text-anchor="start">双曲线的内准圆（a=1.2, b=2）</text>
<text x="402" y="64" font-family="sans-serif" font-size="12"  fill="#b91c1c" text-anchor="start">要求 b > a > 0</text>
<text x="402" y="86" font-family="sans-serif" font-size="12"  fill="#334155" text-anchor="start">1/m² + 1/n² = 1/a² − 1/b²</text>
<text x="402" y="108" font-family="sans-serif" font-size="12"  fill="#0f766e" text-anchor="start">r² = a²b²/(b²−a²)</text>
<text x="402" y="130" font-family="sans-serif" font-size="12"  fill="#334155" text-anchor="start">|AB| ≥ 2ab/√(b²−a²)</text>
<text x="402" y="152" font-family="sans-serif" font-size="12"  fill="#334155" text-anchor="start">S△AOB ≥ a²b²/(b²−a²)</text>
<text x="402" y="174" font-family="sans-serif" font-size="12"  fill="#64748b" text-anchor="start">（虚线为渐近线）</text>
